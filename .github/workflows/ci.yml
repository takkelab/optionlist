# testing.md §6。目標値の判定は scripts/metrics-check.ts（ローカルの npm run metrics:check と同じ）
# 性能（testing.md §3）と E2E（testing.md §5）も metrics:check が流す（npm run test:perf・npm run test:e2e）
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    # edited: PR 本文を直したときにも pr-check をやり直す
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        # テスト用 DB は db:roles:test が ol_migrator の持ち物として作る（POSTGRES_DB で作ると持ち主が postgres になる。data.md §4）
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # サービスコンテナは SSL を使わない（dbmate は sslmode を書かないと SSL でつなごうとする）
      # postgres はロールと DB を作るときだけ使う。マイグレーション・後始末は ol_migrator、アプリとしてのテストは ol_app（testing.md §0）
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://ol_migrator:ol_migrator@127.0.0.1:5432/optionlist_test?sslmode=disable
      APP_DATABASE_URL: postgres://ol_app:ol_app@127.0.0.1:5432/optionlist_test?sslmode=disable
      IP_HASH_SECRET: ci-ip-hash-secret
      # GcsPhotoFiles のテストがつなぐ fake-gcs-server（下の Start fake-gcs-server。CI では GCS のテストを飛ばさない。docs/decisions/0051）
      GCS_EMULATOR_URL: http://localhost:4443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci
      - name: Install the browser for E2E
        run: npx playwright install --with-deps chromium
      # dbmate の --env-file はファイルがないと止まるので、ローカルと同じく backend/.env.test を作る
      - name: Create the roles and migrate the test database
        run: |
          {
            echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "APP_DATABASE_URL=$APP_DATABASE_URL"
            echo "IP_HASH_SECRET=$IP_HASH_SECRET"
            echo "GCS_EMULATOR_URL=$GCS_EMULATOR_URL"
          } > backend/.env.test
          npm --prefix backend run db:roles:test
          npm --prefix backend run db:migrate:test
      # サービスコンテナは起動の引数（-scheme http など）を渡せないので、手元と同じ npm script で docker run する
      - name: Start fake-gcs-server
        run: |
          npm --prefix backend run gcs:emulator
          for i in $(seq 1 30); do
            curl -fsS "$GCS_EMULATOR_URL/storage/v1/b" > /dev/null && exit 0
            sleep 1
          done
          echo "fake-gcs-server が起動しなかった" >&2
          docker logs optionlist-fake-gcs
          exit 1
      - name: Test the quality scripts
        run: npm run test:scripts
      - name: metrics:check
        run: npm run metrics:check
      - name: Upload metrics-report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: metrics-report.json
          if-no-files-found: warn

  # 本番用のイメージを作り、Postgres のサービスコンテナにつないで起動して確かめる（testing.md §6 の 8、metrics.md §2。docs/decisions/0054）
  # main に入ったときのデプロイ（R8）は、ここと同じ Dockerfile で作ったイメージを出す
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://ol_migrator:ol_migrator@127.0.0.1:5432/optionlist_test?sslmode=disable
      # コンテナからは host.docker.internal に向け直してつなぐ（scripts/lib/image-smoke.ts）
      APP_DATABASE_URL: postgres://ol_app:ol_app@127.0.0.1:5432/optionlist_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install the backend (roles and migrations)
        run: npm --prefix backend ci
      - name: Create the roles and migrate the test database
        run: |
          {
            echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "APP_DATABASE_URL=$APP_DATABASE_URL"
            echo "IP_HASH_SECRET=ci-ip-hash-secret"
          } > backend/.env.test
          npm --prefix backend run db:roles:test
          npm --prefix backend run db:migrate:test
      - name: Build the image
        run: docker build -t optionlist:local .
      - name: Smoke test the image
        run: npm run smoke:image -- optionlist:local

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Check PR body and decisions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:pr
