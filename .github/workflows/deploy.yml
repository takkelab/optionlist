# 確認用・本番へのデプロイ（architecture.md §4.1、testing.md §6。docs/decisions/0036・0055・0057）
# - main への push: イメージを 1 回だけ作って Artifact Registry に置き、確認用でマイグレーションしてから、ダイジェストで出す
# - workflow_dispatch（自分が Actions の画面から起動する）: 確認用でトラフィックを 100% 受けているリビジョンのイメージを、
#   ダイジェストのまま本番でマイグレーションしてから出す。作り直さない。コミットやタグは選ばせない
# Google Cloud へは Workload Identity Federation で入る（鍵を置かない）。どのサービスアカウントに入れるかは、
# プロバイダが workflow_ref（このファイルの main）と event_name（push / workflow_dispatch）で決める（infra/config.ts）
# 値は infra/config.ts と同じにする（scripts/tests/deploy-workflow.test.ts が確かめる）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# actions: write・write-all は与えない（ほかのワークフローから workflow_dispatch を起動させない。docs/decisions/0055）
permissions:
  contents: read
  id-token: write

# 同じ環境へのデプロイは 1 つずつ。途中で止めない（マイグレーションの途中で切らない）
# shell を書くと bash -eo pipefail で動く（書かないと -e だけで、gcloud | jq の gcloud の失敗が見えず、別のメッセージで止まる）
defaults:
  run:
    shell: bash

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || 'production' }}
  cancel-in-progress: false

env:
  PROJECT_ID: project-2465a1be-8ac7-4a7e-99a
  REGION: asia-northeast1
  WORKLOAD_IDENTITY_PROVIDER: projects/55327626788/locations/global/workloadIdentityPools/github/providers/optionlist-deploy
  IMAGE: asia-northeast1-docker.pkg.dev/project-2465a1be-8ac7-4a7e-99a/optionlist/optionlist
  # サービスの describe から、トラフィックを 100% 受けているイメージを読む jq の式（なければ空）
  # 100% のリビジョンがちょうど 1 つで、それが最新の Ready のリビジョンのときだけ、テンプレートのイメージ（ダイジェストで出したもの）を返す
  # revisions API を使わないのは、本番のデプロイ用のサービスアカウントには確認用のサービスの読み取りしか付けないため（docs/decisions/0055）
  SERVING_IMAGE: >-
    [.status.traffic[] | select(.percent == 100) | .revisionName] as $r
    | if ($r | length) == 1 and $r[0] == .status.latestReadyRevisionName and $r[0] == .status.latestCreatedRevisionName
      then .spec.template.spec.containers[0].image else "" end

jobs:
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE: optionlist-staging
      MIGRATE_JOB: optionlist-staging-migrate
      CLEANUP_JOB: optionlist-staging-cleanup
      ORIGIN: https://staging.optionlist.app
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: optionlist-staging-deploy@project-2465a1be-8ac7-4a7e-99a.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "DIGEST_IMAGE=$digest" >> "$GITHUB_ENV"
          echo "イメージ: $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Migrate the staging database
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$DIGEST_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --project "$PROJECT_ID" --wait
      - name: Update the cleanup job image
        run: |
          gcloud run jobs update "$CLEANUP_JOB" --image "$DIGEST_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet
      - name: Deploy to staging
        run: |
          gcloud run deploy "$SERVICE" --image "$DIGEST_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet
          # トラフィックを特定のリビジョンに固定していても（手で戻したあとなど）、出したものに 100% を移す
          gcloud run services update-traffic "$SERVICE" --to-latest --region "$REGION" --project "$PROJECT_ID" --quiet
      - name: Check that the new image serves 100%
        run: |
          serving=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json | jq -r "$SERVING_IMAGE")
          if [ "$serving" != "$DIGEST_IMAGE" ]; then
            echo "100% を受けているイメージが出したものと違う: ${serving:-（100% のリビジョンがない）}" >&2
            exit 1
          fi
      - name: Check /api/health
        run: |
          curl -fsS "$ORIGIN/api/health" | grep -qx '{"status":"ok"}'
          curl -fsS "$ORIGIN/api/health/db" > /dev/null

  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_SERVICE: optionlist-staging
      SERVICE: optionlist-production
      MIGRATE_JOB: optionlist-production-migrate
      CLEANUP_JOB: optionlist-production-cleanup
      BACKUP_JOB: optionlist-production-backup
      ORIGIN: https://optionlist.app
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: optionlist-production-deploy@project-2465a1be-8ac7-4a7e-99a.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # 確認用でトラフィックを 100% 受けているリビジョンがちょうど 1 つでなければ止まる
      - name: Read the image serving 100% on staging
        run: |
          digest=$(gcloud run services describe "$STAGING_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json | jq -r "$SERVING_IMAGE")
          case "$digest" in
            "$IMAGE@sha256:"*) ;;
            "") echo "確認用で、最新のリビジョンがトラフィックを 100% 受けていない（分けて流している・出している最中なら、そろえてから起動し直す）" >&2; exit 1 ;;
            *) echo "確認用のイメージがダイジェストで決まっていない、または置き場所が違う: $digest" >&2; exit 1 ;;
          esac
          echo "DIGEST_IMAGE=$digest" >> "$GITHUB_ENV"
          echo "確認用のイメージ: $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Migrate the production database
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$DIGEST_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --project "$PROJECT_ID" --wait
      - name: Update the cleanup job image
        run: |
          gcloud run jobs update "$CLEANUP_JOB" --image "$DIGEST_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet
      # 週 1 の書き出しの Job（本番だけ。data.md §6）も、出すものと同じイメージ（pg_dump 入り）にする
      - name: Update the backup job image
        run: |
          gcloud run jobs update "$BACKUP_JOB" --image "$DIGEST_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet
      - name: Deploy to production
        run: |
          gcloud run deploy "$SERVICE" --image "$DIGEST_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet
          gcloud run services update-traffic "$SERVICE" --to-latest --region "$REGION" --project "$PROJECT_ID" --quiet
      - name: Check that the new image serves 100%
        run: |
          serving=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json | jq -r "$SERVING_IMAGE")
          if [ "$serving" != "$DIGEST_IMAGE" ]; then
            echo "100% を受けているイメージが出したものと違う: ${serving:-（100% のリビジョンがない）}" >&2
            exit 1
          fi
      - name: Check /api/health
        run: |
          curl -fsS "$ORIGIN/api/health" | grep -qx '{"status":"ok"}'
          curl -fsS "$ORIGIN/api/health/db" > /dev/null
